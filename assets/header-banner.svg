<svg width="100%" height="150" viewBox="0 0 880 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Subtle Charcoal Depth) -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#090D15" />
    </linearGradient>

    <!-- Restrained Accent Gradients -->
    <linearGradient id="schematicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3" />
    </linearGradient>

    <style>
      .kicker {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        fill: #38BDF8;
      }
      .name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.4px;
        fill: #F8FAFC;
      }
      .subtext {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: 0.1px;
        fill: #94A3B8;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #64748B;
      }
      .interpunct {
        fill: #38BDF8;
        font-weight: 400;
      }
      .tech-mark {
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        fill: #475569;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Base Architectural Container -->
  <rect x="0.5" y="0.5" width="879" height="149" rx="8" fill="url(#canvasGrad)" stroke="#21262D" stroke-width="1" />

  <!-- Precision Corner Registration Marks -->
  <path d="M 16 26 L 16 16 L 26 16" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.65" fill="none" />
  <path d="M 864 124 L 864 134 L 854 134" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.5" fill="none" />

  <!-- Left Architectural Accent Notch -->
  <rect x="36" y="24" width="2" height="102" rx="1" fill="#38BDF8" fill-opacity="0.8" />

  <!-- Typographic Layout -->
  <g transform="translate(54, 0)">
    <!-- Overline Kicker -->
    <text x="0" y="38" class="kicker">SYSTEMS · ALGORITHMS · AI/ML</text>

    <!-- Name -->
    <text x="0" y="68" class="name">Nikhil Singh</text>

    <!-- Role / Discipline -->
    <text x="0" y="95" class="subtext">AI &amp; ML Student <tspan class="interpunct">·</tspan> Software Developer <tspan class="interpunct">·</tspan> Open-Source Contributor</text>

    <!-- Mission & Tagline -->
    <text x="0" y="119" class="tagline">Building practical software, solving algorithmic problems, and contributing to open source.</text>
  </g>

  <!-- Right-Hand Precision Engineering Geometric Motif -->
  <g transform="translate(710, 22)" opacity="0.9">
    <!-- Subtle Background Dot Coordinates -->
    <circle cx="20" cy="15" r="1" fill="#334155" />
    <circle cx="60" cy="15" r="1" fill="#334155" />
    <circle cx="100" cy="15" r="1" fill="#334155" />
    <circle cx="20" cy="55" r="1" fill="#334155" />
    <circle cx="60" cy="55" r="1" fill="#334155" />
    <circle cx="100" cy="55" r="1" fill="#334155" />
    <circle cx="20" cy="95" r="1" fill="#334155" />
    <circle cx="60" cy="95" r="1" fill="#334155" />
    <circle cx="100" cy="95" r="1" fill="#334155" />

    <!-- Isometric Geometric Wireframe / Algorithmic Graph -->
    <!-- Base Graph Edges -->
    <path d="M 60 15 L 105 40 L 105 85 L 60 105 L 15 85 L 15 40 Z" stroke="#1E293B" stroke-width="1" fill="none" />
    <path d="M 60 15 L 60 60 L 105 85" stroke="#1E293B" stroke-width="1" fill="none" />
    <path d="M 60 60 L 15 85" stroke="#1E293B" stroke-width="1" fill="none" />

    <!-- Active Accent Vectors (Muted Cyan & Slate Indigo) -->
    <line x1="60" y1="15" x2="60" y2="60" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="60" y1="60" x2="105" y2="40" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="2 3" />
    <line x1="15" y1="40" x2="60" y2="60" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="60" y1="60" x2="60" y2="105" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.5" />

    <!-- Network Graph Nodes -->
    <circle cx="60" cy="15" r="2.5" fill="#0D1117" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="105" cy="40" r="2" fill="#0D1117" stroke="#64748B" stroke-width="1" />
    <circle cx="15" cy="40" r="2.5" fill="#0D1117" stroke="#818CF8" stroke-width="1.2" />
    <circle cx="60" cy="60" r="3.5" fill="#38BDF8" fill-opacity="0.9" />
    <circle cx="105" cy="85" r="2" fill="#0D1117" stroke="#64748B" stroke-width="1" />
    <circle cx="15" cy="85" r="2" fill="#0D1117" stroke="#64748B" stroke-width="1" />
    <circle cx="60" cy="105" r="2.5" fill="#0D1117" stroke="#818CF8" stroke-width="1.2" />

    <!-- Tiny Technical Label -->
    <text x="60" y="118" class="tech-mark" text-anchor="middle">NODE // 01</text>
  </g>
</svg>
