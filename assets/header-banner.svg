<svg width="100%" height="175" viewBox="0 0 880 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Obsidian / Midnight Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#090E1D" />
    </linearGradient>

    <!-- Electric Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glowing Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.85" />
    </linearGradient>

    <!-- Atmospheric Glows -->
    <radialGradient id="cyanAtmosphere" cx="10%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleAtmosphere" cx="90%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="gridPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.65" stroke-opacity="0.65"/>
      <circle cx="28" cy="0" r="0.8" fill="#38BDF8" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="876" height="171" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Subtle Cyber Grid -->
  <rect x="2" y="2" width="876" height="171" rx="14" fill="url(#gridPattern)" opacity="0.85" />

  <!-- Atmospheric Glow Overlays -->
  <rect x="2" y="2" width="876" height="171" rx="14" fill="url(#cyanAtmosphere)" />
  <rect x="2" y="2" width="876" height="171" rx="14" fill="url(#purpleAtmosphere)" />

  <!-- Top Accent Bar -->
  <rect x="20" y="2" width="840" height="2.5" rx="1.2" fill="url(#neonGrad)" />

  <!-- Status Chip (Top Right) -->
  <g transform="translate(680, 24)">
    <rect x="0" y="0" width="168" height="24" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.5"/>
    <circle cx="12" cy="12" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="23" y="15.5" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.4">OPEN FOR COLLAB</text>
  </g>

  <!-- Title: NIKHIL SINGH -->
  <text x="36" y="66" fill="url(#neonGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="1.2">
    NIKHIL SINGH
  </text>

  <!-- Subtitle -->
  <text x="36" y="98" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14.5" font-weight="600" letter-spacing="0.3">
    AI &amp; ML Engineering Student <tspan fill="#38BDF8">|</tspan> Software Developer <tspan fill="#818CF8">|</tspan> Open Source Contributor
  </text>

  <!-- Tagline -->
  <text x="36" y="126" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="13" font-weight="400">
    Building useful software. Solving problems. Contributing to open source.
  </text>

  <!-- Compact Tech Chips (Bottom Row) -->
  <g transform="translate(36, 142)">
    <text x="0" y="12" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600">⚡ C++</text>
    <text x="54" y="12" fill="#64748B" font-family="monospace" font-size="11">•</text>
    <text x="68" y="12" fill="#818CF8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600">Python</text>
    <text x="124" y="12" fill="#64748B" font-family="monospace" font-size="11">•</text>
    <text x="138" y="12" fill="#38BDF8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600">React</text>
    <text x="185" y="12" fill="#64748B" font-family="monospace" font-size="11">•</text>
    <text x="199" y="12" fill="#4ADE80" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600">Node.js</text>
    <text x="259" y="12" fill="#64748B" font-family="monospace" font-size="11">•</text>
    <text x="273" y="12" fill="#34D399" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600">MongoDB</text>
    <text x="345" y="12" fill="#64748B" font-family="monospace" font-size="11">•</text>
    <text x="359" y="12" fill="#C084FC" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600">AI / ML</text>
    <text x="419" y="12" fill="#64748B" font-family="monospace" font-size="11">•</text>
    <text x="433" y="12" fill="#94A3B8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="500">Apple Silicon M2</text>
  </g>
</svg>
