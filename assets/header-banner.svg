<svg width="100%" height="135" viewBox="0 0 880 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: -0.3px;
        fill: #F8FAFC;
      }
      .subtext {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: 0.1px;
        fill: #94A3B8;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 12.5px;
        font-weight: 400;
        fill: #64748B;
      }
      .bullet {
        fill: #38BDF8;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Editorial Charcoal Container -->
  <rect x="0.5" y="0.5" width="879" height="134" rx="8" fill="#0D1117" stroke="#21262D" stroke-width="1" />

  <!-- Restrained Steel-Cyan Accent Rule -->
  <rect x="36" y="32" width="2" height="72" rx="1" fill="#38BDF8" fill-opacity="0.85" />

  <!-- Editorial Typographic Hierarchy -->
  <g transform="translate(54, 0)">
    <text x="0" y="52" class="name">Nikhil Singh</text>
    <text x="0" y="78" class="subtext">AI &amp; ML Student <tspan class="bullet">·</tspan> Software Developer <tspan class="bullet">·</tspan> Open-Source Contributor</text>
    <text x="0" y="101" class="tagline">Building practical software and contributing to meaningful open-source projects.</text>
  </g>
</svg>
