<svg width="100%" height="210" viewBox="0 0 900 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .mono-meta {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #64748B;
      }
      .mono-accent {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #38BDF8;
      }
      .name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.6px;
        fill: #F8FAFC;
      }
      .role {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 500;
        letter-spacing: 0.1px;
        fill: #94A3B8;
      }
      .statement {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 15.5px;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: -0.15px;
        fill: #E2E8F0;
      }
      .table-label {
        font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        fill: #64748B;
      }
      .table-value {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        font-size: 11.5px;
        font-weight: 500;
        fill: #CBD5E1;
      }
      .table-value-accent {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        fill: #38BDF8;
      }
      .interpunct {
        fill: #38BDF8;
      }
    </style>
  </defs>

  <!-- Editorial Charcoal Canvas -->
  <rect x="0.5" y="0.5" width="899" height="209" rx="4" fill="#0C1017" stroke="#1E293B" stroke-width="1" />

  <!-- Top Frame Registration Crosshairs -->
  <path d="M 12 16 L 20 16 M 16 12 L 16 20" stroke="#334155" stroke-width="1" />
  <path d="M 880 16 L 888 16 M 884 12 L 884 20" stroke="#334155" stroke-width="1" />
  <path d="M 12 194 L 20 194 M 16 190 L 16 198" stroke="#334155" stroke-width="1" />
  <path d="M 880 194 L 888 194 M 884 190 L 884 198" stroke="#334155" stroke-width="1" />

  <!-- LEFT COLUMN: Identity & Foundation (x = 44) -->
  <g transform="translate(44, 0)">
    <!-- Meta Kicker -->
    <text x="0" y="44" class="mono-meta">FOLIO // 2026 <tspan fill="#38BDF8">·</tspan> B.TECH AI &amp; ML</text>

    <!-- Name -->
    <text x="0" y="86" class="name">Nikhil Singh</text>

    <!-- Role Description -->
    <text x="0" y="116" class="role">AI &amp; ML Student <tspan class="interpunct">·</tspan> Software Developer</text>
    <text x="0" y="136" class="role">Open-Source Contributor</text>

    <!-- Architectural Badge -->
    <rect x="0" y="156" width="195" height="24" rx="3" fill="#111827" stroke="#1F2937" stroke-width="1" />
    <text x="12" y="172" class="table-value-accent">C++ · PYTHON · FULL-STACK</text>
  </g>

  <!-- CENTRAL VERTICAL DIVISION RULE -->
  <line x1="385" y1="26" x2="385" y2="184" stroke="#1E293B" stroke-width="1" />
  <path d="M 381 26 L 389 26 M 385 22 L 385 30" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8" />
  <path d="M 381 184 L 389 184 M 385 180 L 385 188" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.8" />

  <!-- RIGHT COLUMN: Mission & Architectural Matrix (x = 422) -->
  <g transform="translate(422, 0)">
    <!-- Section Header -->
    <text x="0" y="44" class="mono-accent">01 / FOCUS &amp; PRACTICE</text>

    <!-- Main Editorial Mission Statement -->
    <text x="0" y="78" class="statement">Building practical software, solving algorithmic</text>
    <text x="0" y="102" class="statement">problems, and contributing to open source.</text>

    <!-- Horizontal Structural Separator -->
    <line x1="0" y1="128" x2="434" y2="128" stroke="#1E293B" stroke-width="1" />

    <!-- Sub-Section Matrix: 2 Columns -->
    <!-- Col A: Core Disciplines -->
    <g transform="translate(0, 148)">
      <text x="0" y="0" class="table-label">CORE DISCIPLINES</text>
      <text x="0" y="18" class="table-value">Algorithms · Systems · Web Architecture</text>
    </g>

    <!-- Col B: Active Ecosystems -->
    <g transform="translate(230, 148)">
      <text x="0" y="0" class="table-label">ACTIVE ECOSYSTEMS</text>
      <text x="0" y="18" class="table-value-accent">Gno.land · FreeCAD · Pipedream</text>
    </g>
  </g>
</svg>
